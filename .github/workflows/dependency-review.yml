name: dependency-review

on: pull_request

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: capability
        name: Detect dependency graph support
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/dependency-graph/sbom" \
            >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependency graph is unavailable; dependency review is skipped."
          fi
      - name: Review dependency changes
        if: ${{ steps.capability.outputs.available == 'true' }}
        uses: actions/dependency-review-action@v5
